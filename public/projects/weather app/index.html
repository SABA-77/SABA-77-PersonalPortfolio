<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<center>
    <h1>Welcome Saba Weather App</h1>
    <div class="weather-app">

        <h1>Weather App 🌤️</h1>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name"
            >

            <button id="searchBtn">Search</button>
        <button class="dark-mode-btn">Dark Mode</button> <br>
    </div>

        <p id="message"></p>

        <div class="weather-card">

            <h2 id="cityName">Chennai</h2>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h3 id="temperature">--°C</h3>

            <p id="condition">Search for a city</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </div>

    </div>

    
    <br>
    <br>



    <script src="script.js"></script>
    <script src="darkmode.js"></script>
</center>
</body>
</html>
