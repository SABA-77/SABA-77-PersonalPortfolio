<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="form-container">

    <h1>Student Registration</h1>

    <p>
        Please fill in your details below.
    </p>


    <form id="studentForm">


        <!-- NAME -->

        <label for="name">
            Name *
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >



        <!-- EMAIL -->

        <label for="email">
            Email *
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >



        <!-- PHONE -->

        <label for="phone">
            Phone Number *
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
        >



        <!-- GENDER -->

        <label>
            Gender *
        </label>


        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="gender"
                    value="Male"
                    required
                >

                Male
            </label>


            <label>
                <input
                    type="radio"
                    name="gender"
                    value="Female"
                >

                Female
            </label>

        </div>



        <!-- COURSE -->

        <label for="course">
            Course *
        </label>


        <select id="course" required>

            <option value="">
                Select your course
            </option>

            <option value="BCA">
                BCA
            </option>

            <option value="MCA">
                MCA
            </option>

            <option value="B.Sc Computer Science">
                B.Sc Computer Science
            </option>

        </select>



        <!-- MESSAGE -->

        <label for="message">
            Message
        </label>


        <textarea
            id="message"
            placeholder="Enter your message">
        </textarea>



        <!-- SUBMIT -->

        <button type="submit">
            Submit
        </button>


    </form>


    <p id="result"></p>


</div>


<script src="script.js"></script>

</body>

</html>
